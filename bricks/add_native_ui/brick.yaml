name: add_native_ui
description: Upgrades an existing headless plugin by generating presentation layer and patching build.gradle.kts to enable Jetpack Compose.
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.26 <1.0.0"

vars:
  name:
    type: string
    description: Plugin name in snake_case (e.g. biometric_auth, custom_sensor)
    prompt: What is the plugin name?
  package:
    type: string
    description: Base package name (e.g. com.danhdue.biometric)
    prompt: What is the base package name?
