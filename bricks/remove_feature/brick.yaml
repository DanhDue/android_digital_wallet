name: remove_feature
description: Removes an MVI feature module and unwinds every wire point mvi_feature adds — for both install-time and on-demand (dynamic-feature) deliveries.
version: 0.2.0+1

vars:
  name:
    type: string
    description: Feature name to remove (PascalCase, e.g., Sample, Payment)
    prompt: What is the feature name to remove? (PascalCase)
