# ---------------------------------------------------------------------------
# CI — first pipeline for this native Android repo (Phase 0 of the
# `android_super_app_template` epic, design §6.3).
#
# Scope this round (deliberately minimal — see epic design §6.3 / §10):
#   * One job, no matrix. The Gradle build cache (setup-gradle) carries the
#     cost after the first run.
#   * NO secrets. NO Firebase / google-services.json. NO signing config.
#     `app` release build has `isMinifyEnabled = false` and no signing, and we
#     only build `assembleDebug`, so nothing secret is required.
#   * `bundleDebug` is built on every PR (Task 14) so the AAB — including the
#     on-demand `:features:scanner` Dynamic Feature Module split — is exercised
#     in CI. Task 16 extends THIS workflow with a bundletool
#     `build-apks --local-testing` step that hard-fails the job unless the
#     `scanner` dynamic-feature split APK is present in the generated `.apks`
#     (pinned bundletool 1.17.2, SHA-256-verified download — no device needed).
#
# Governance value (design §4.2 / §6.3): a breaking change to a public
# `:core` / `:platform` type fails `assembleDebug` for every dependent module —
# caught at compile time, blocking the merge. Konsist (`:konsist-test:test`),
# detekt and spotless are the architecture / style gates.
#
# JDK: Java 21. The project targets JVM 21 everywhere — `AppConfig.kt`
# (`sourceCompatibility/targetCompatibility = VERSION_21`, `jvmTarget = JVM_21`),
# `detekt-check.gradle.kts` (`jvmTarget = VERSION_21`), `:konsist-test`
# (`JvmTarget.JVM_21`) — and `compileSdk 36` needs a JDK 17+ AGP toolchain.
# 21 is the only JDK that builds every module; temurin 17 would fail the
# Kotlin/detekt compile steps.
#
# The Android SDK is provided by the GitHub-hosted `ubuntu-latest` runner image
# (`$ANDROID_HOME` / `$ANDROID_SDK_ROOT` preinstalled). `local.properties` is
# git-ignored and intentionally absent here; no build script requires it
# (`getLocalProperties` in the root build script is defined but never called).
#
# Rollback: delete this file.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - "epic/**"

# A newer push to the same branch / PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Konsist + detekt + spotless + unit tests + assembleDebug + bundleDebug + scanner-split assertion
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write to the dependency/build cache from the default branch so
          # PR runs get a warm read-only cache without polluting it.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Build & verify
        run: ./gradlew --no-daemon --stacktrace :konsist-test:test detekt spotlessCheck testDebugUnitTest assembleDebug bundleDebug

      # ---------------------------------------------------------------------
      # Task 16 — split-existence assertion.
      #
      # `bundleDebug` above produces the AAB; this step proves the on-demand
      # `:features:scanner` Dynamic Feature Module actually materialises as its
      # own split APK when bundletool expands the bundle. `--local-testing`
      # builds the full `.apks` set (base + config + feature splits) with the
      # debug keystore and NO device. The job fails unless a `scanner` feature
      # split APK (`splits/scanner-*.apk`) is in that archive — catching a
      # regression where the module silently fuses into the base APK or drops
      # out of `android.dynamicFeatures`.
      #
      # bundletool is pinned to an exact version AND its download is
      # SHA-256-verified before it is executed.
      # ---------------------------------------------------------------------
      - name: Assert scanner dynamic-feature split exists (bundletool --local-testing)
        run: |
          set -Eeuo pipefail
          BT_VERSION="1.17.2"
          BT_SHA256="2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae"
          BT_JAR="${RUNNER_TEMP}/bundletool-all-${BT_VERSION}.jar"
          APKS="${RUNNER_TEMP}/app-debug.apks"
          AAB="app/build/outputs/bundle/debug/app-debug.aab"

          test -f "${AAB}" || { echo "::error::${AAB} not found — bundleDebug did not run"; exit 1; }

          curl -fsSL --retry 3 --retry-all-errors -o "${BT_JAR}" \
            "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"
          echo "${BT_SHA256}  ${BT_JAR}" | sha256sum -c -

          java -jar "${BT_JAR}" build-apks \
            --bundle="${AAB}" \
            --output="${APKS}" \
            --local-testing \
            --overwrite

          # List to a file before grepping: `unzip -l … | grep -q` under
          # `set -o pipefail` reports the SIGPIPE from unzip (killed when grep
          # closes the pipe on first match), not grep's result.
          unzip -l "${APKS}" > "${RUNNER_TEMP}/apks.list"

          echo "== ${APKS} contents (feature splits) =="
          grep -E 'splits/.*\.apk' "${RUNNER_TEMP}/apks.list" | grep -v '/base-' || true

          if ! grep -Eq 'splits/[^ ]*scanner[^ ]*\.apk' "${RUNNER_TEMP}/apks.list"; then
            echo "::error::scanner dynamic-feature split APK is MISSING from build-apks --local-testing output"
            echo "         (expected an entry matching splits/scanner-*.apk)"
            grep -E '\.apk$' "${RUNNER_TEMP}/apks.list" || true
            exit 1
          fi
          echo "OK: scanner dynamic-feature split APK is present in the bundle."

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
